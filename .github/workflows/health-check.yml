name: Repo Health Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ secrets.HEALTH_CHECK_PAT }}
          GITHUB_ORG: EbrightOD
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_SECURE: "true"
          SMTP_USER: od@ebright.my
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: od@ebright.my

      # Publish the snapshot so the Ebright dashboard can pull it
      # (GET contents/data/latest.json?ref=health-data). Orphan branch, one
      # force-pushed commit per run, so main's history stays clean.
      - name: Publish snapshot to health-data branch
        run: |
          mkdir -p /tmp/snap/data && cp reports/latest.json /tmp/snap/data/latest.json
          cd /tmp/snap
          git init -q -b health-data
          git config user.name "health-check-bot"
          git config user.email "health-check-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -q -m "Health snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" health-data
